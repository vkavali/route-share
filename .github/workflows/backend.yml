name: Backend CI

on:
  push:
    branches:
      - main
      - codex/seatpal-startup-review-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install existing test requirements
        run: python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q tests

      - name: Run isolated capacity and recovery check
        shell: bash
        run: |
          set -euo pipefail
          scratch_dir="${RUNNER_TEMP}/seatpal-capacity/scratch"
          report_dir="${RUNNER_TEMP}/seatpal-capacity/reports"
          mkdir -p "$scratch_dir" "$report_dir"

          capacity_status=0
          python scripts/production_capacity_check.py \
            --scratch-dir "$scratch_dir" \
            --report-dir "$report_dir" || capacity_status=$?

          report_path="$(find "$report_dir" -maxdepth 1 -type f -name 'production-capacity-*.json' -print | sort | tail -n 1)"
          if [ -z "$report_path" ]; then
            echo "Capacity check did not produce a JSON report."
            exit 1
          fi
          cat "$report_path"

          if [ "$capacity_status" -ne 0 ]; then
            exit "$capacity_status"
          fi
          python - "$report_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("result") != "PASS":
              raise SystemExit(f"Capacity check result was {report.get('result')!r}, expected 'PASS'.")
          print("Capacity check result: PASS (isolated synthetic fixture only)")
          PY
